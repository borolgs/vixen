[package]
name = "axum-vixen-macros"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Proc-macro half of vixen: #[action], #[route], #[id], #[fragment], #[derive(ReqCtx)], assets!, asset! and assets_router!. Use them through axum-vixen."
keywords = ["axum", "htmx", "maud", "web"]
categories = ["web-programming"]

[lib]
name = "vixen_macros"
proc-macro = true

[lints]
workspace = true

[features]
agent = []

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full", "extra-traits", "visit-mut"] }
serde = { workspace = true }
serde_json = { workspace = true }
mime_guess = "2.0.5"
heck = "0.5.0"

# Doctests only. Publishing strips this path-only dependency to avoid a cycle.
# Enable `agent` to match feature-unified workspace builds.
[dev-dependencies]
axum-vixen = { path = "../vixen", features = ["agent"] }
axum = { workspace = true }
axum-extra = { workspace = true }
maud = { workspace = true }
tokio = { workspace = true }
