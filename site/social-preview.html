<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vixen social preview source</title>
    <link rel="stylesheet" href="static/theme.css" />
    <!-- Capture this page at 1200×630, device scale 1, to static/social-preview.png.
         The source stays outside static/ so Zola doesn't publish it as a page. -->
    <style>
      * { box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        padding: 52px 72px;
        border-bottom: 12px solid var(--vixen-sea);
        background: var(--vixen-paper);
        color: var(--vixen-ink);
        font-family: var(--vixen-font-ui);
      }
      img { display: block; width: 432px; height: 108px; }
      h1 { margin: 56px 0 24px; font-size: 64px; line-height: 1.12; font-weight: 600; letter-spacing: -2px; }
      p { margin: 0; font-size: 27px; line-height: 1.5; }
      footer { margin-top: 52px; padding-top: 22px; border-top: 2px solid var(--vixen-peach); font-size: 22px; }
    </style>
  </head>
  <body>
    <img src="static/logo.svg" alt="vixen" width="432" height="108" />
    <h1>Server-driven UI<br />with Rust, axum and htmx</h1>
    <p>Typed actions. Page-local TypeScript and CSS.</p>
    <footer>borolgs.github.io/vixen</footer>
  </body>
</html>
