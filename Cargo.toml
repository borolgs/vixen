[workspace]
resolver = "3"
members = [
    "vixen",
    "vixen-bundler",
    "vixen-macros",
    "examples/counter",
    "examples/todos",
    "examples/components",
    "examples/config",
]

[workspace.package]
edition = "2024"
version = "0.1.2"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/borolgs/vixen"
publish = true

[workspace.lints.rust]

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "warn"

[workspace.dependencies]
axum = { version = "0.8.8", features = ["macros"] }
axum-extra = { version = "0.12.5", features = ["form", "typed-routing"] }
# TODO: enable `v4` once https://github.com/robertwayne/axum-htmx/pull/38 ships.
axum-htmx = { version = "0.8.1", features = ["serde", "auto-vary"] }
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
