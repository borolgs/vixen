name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --no-deps --locked -p axum-vixen -p axum-vixen-macros -p axum-vixen-bundler
        env:
          RUSTDOCFLAGS: -D warnings
      - run: bunx biome ci .

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cargo install wasm-pack --version 0.15.1 --locked
      - run: cargo clippy -p vixen-preview --target wasm32-unknown-unknown --locked -- -D warnings
      - run: bun run --cwd examples/vixen-preview build
      - run: bun run --cwd examples/vixen-preview test
