[package]
name = "vixen-preview"
description = "WASM previews for vixen documentation"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
axum-vixen = { path = "../../vixen" }
axum-extra = { workspace = true }
maud = { workspace = true }
# The workspace enables axum's TCP server; this browser crate only needs routing.
axum = { version = "0.8.8", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1.44"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Headers", "Request", "Response", "ResponseInit"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-web = "0.1.4"

[package.metadata.wasm-pack.profile.release]
# Keep the build on Rust/LLVM's output; no separate Binaryen toolchain needed.
wasm-opt = false
