[package]
name = "axum-vixen"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/axum-vixen/latest/vixen/"
publish.workspace = true
description = "Server-driven UI with Rust, axum and htmx. Typed actions, HTML fragments, and page-local TypeScript and CSS bundling."
keywords = ["axum", "htmx", "maud", "web", "ssr"]
categories = ["web-programming", "web-programming::http-server"]

[lib]
name = "vixen"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
agent = ["dep:strum", "axum-vixen-macros/agent"]
basecoatui = []
testing = ["dep:scraper"]

[dependencies]
axum-vixen-macros = { path = "../vixen-macros", version = "0.4.0" }
axum-vixen-bundler = { path = "../vixen-bundler", version = "0.4.0" }

axum-htmx = { workspace = true }
axum-extra = { workspace = true }
maud = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_html_form = "0.2.8"
strum = { workspace = true, optional = true }

tokio = { version = "1.49.0", default-features = false, features = ["rt"] }

scraper = { version = "0.27.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser routers don't need axum's TCP server or Tokio's networking features.
axum = { version = "0.8.8", default-features = false, features = ["macros", "original-uri"] }

[dev-dependencies]
strum = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
trybuild = "1.0.121"
